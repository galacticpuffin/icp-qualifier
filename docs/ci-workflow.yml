name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ruff==0.17.2 mypy bandit pip-audit
      - run: ruff check icpq tests
      - run: mypy icpq --ignore-missing-imports --no-strict-optional --check-untyped-defs || true   # advisory until annotations land
      - run: bandit -q -r icpq -lll
      - run: pip-audit --strict -r /dev/null || true                                                # runtime has no third-party dependencies
  test:
    runs-on: ubuntu-latest
    strategy: {matrix: {python: ["3.11", "3.12", "3.13"]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install pytest
      - run: pytest -q
  e2e-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest playwright && playwright install --with-deps chromium
      - run: python scripts/browser_e2e.py --out test-results
      - run: python scripts/customer_journey.py --out test-results/journey
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: screenshots, path: test-results}
  docker:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t icpq:ci .
      - name: smoke test the image
        run: |
          docker run -d --name icpq -p 8890:8890 -e ICPQ_ADMIN_EMAIL=ci@example.com -e ICPQ_ADMIN_PASSWORD=ci-password-123 icpq:ci
          for i in $(seq 30); do curl -fs localhost:8890/healthz && break; sleep 1; done
          curl -fs localhost:8890/healthz
          docker exec icpq python -m icpq backup
  deploy:
    # Manual only, gated by the "production" environment's required reviewers. Never runs automatically.
    if: github.event_name == 'workflow_dispatch'
    needs: [quality, test, e2e-browser, docker]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Add your deployment step here (registry push / SSH). Requires approval in the production environment."
