<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lists TITLE runs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/orig.css">
<link rel="stylesheet" href="/static/app.css">
</head><body>
<div class="wrap">
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <section class="sec">
    <div class="sh"><h2>Upload a list</h2><span class="faint small">CSV or Excel (.xlsx) · a company name and/or website column is enough</span></div>
    <div class="panel" style="display:flex;flex-direction:column;gap:14px">
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a file">Drop a CSV / XLSX here, or click to choose<input type="file" id="file" accept=".csv,.xlsx,.xlsm,.txt" hidden></div>
      <div id="mapBox" class="hidden" style="display:flex;flex-direction:column;gap:12px">
        <div class="row"><b id="mapTitle"></b><span class="faint small" id="mapRows"></span></div>
        <label class="f">List name<input class="in" id="lname"></label>
        <div class="grid3" id="mapGrid"></div>
        <div class="tbox"><table class="list-table" id="sample"></table></div>
        <div class="grid2"><label class="f">Qualify with ICP profile<select class="in" id="lprof"></select></label>
          <label class="f">Workers (parallel companies)<input class="in" id="threads" type="number" min="1" max="32" placeholder="default"></label></div>
        <div class="row"><button class="btn primary" id="go" type="button">Import and start research</button><button class="btn" id="goImport" type="button">Import only</button><span class="small" id="gomsg"></span></div>
      </div>
    </div>
  </section>
  <section class="sec">
    <div class="sh"><h2>Lists &amp; runs</h2><span class="faint small">Runs are resumable: pause, stop or restart the app at any time</span></div>
    <div class="panel tbox"><table class="list-table"><thead><tr><th>List</th><th>Rows → companies</th><th>Profile</th><th>Research</th><th>Run</th><th>Actions</th></tr></thead><tbody id="ltb"></tbody></table></div>
  </section>
</div>
<script src="/static/common.js"></script>
<script src="/static/lists.js"></script>
</body></html>
